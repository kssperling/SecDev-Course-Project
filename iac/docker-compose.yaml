version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: secdev-app:local
    container_name: fastapi-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PYTHONPATH=/app
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; requests.get('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
