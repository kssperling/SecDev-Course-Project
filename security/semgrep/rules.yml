# security/semgrep/rules.yml
# Custom Semgrep rules for SecDev Course Project

rules:
  # Правило 1: Проверка на использование потенциально опасных функций
  - id: py-dangerous-exec
    languages: [python]
    message: "Потенциально опасное использование exec/eval"
    severity: WARNING
    pattern: |
      exec(...)
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"

  # Правило 2: Проверка на XSS в FastAPI
  - id: py-fastapi-xss
    languages: [python]
    message: "Потенциальная уязвимость XSS в FastAPI endpoint"
    severity: WARNING
    pattern: |
      @app.$METHOD("...")
      def $FUNC(...):
        ...
        return $RESPONSE($USER_INPUT)
    pattern-either:
      - pattern: HTMLResponse($USER_INPUT)
      - pattern: PlainTextResponse($USER_INPUT)
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      owasp: "A03:2021 - Injection"

  # Правило 3: Проверка на hardcoded секреты
  - id: py-hardcoded-secret
    languages: [python]
    message: "Возможно hardcoded секрет в коде"
    severity: ERROR
    pattern-regex: |
      (?i)(password|secret|token|key|api[_-]?key)\s*=\s*['"][^'"]{8,}['"]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"

  # Правило 4: Проверка на SQL injection паттерны
  - id: py-sql-injection-pattern
    languages: [python]
    message: "Потенциальный SQL injection паттерн"
    severity: WARNING
    pattern: |
      f"SELECT ... {$VARIABLE} ..."
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"

  # Правило 5: Проверка на небезопасные десериализации
  - id: py-insecure-deserialization
    languages: [python]
    message: "Потенциально небезопасная десериализация"
    severity: ERROR
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: yaml.load(...)
      - pattern: json.loads(..., object_hook=...)
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"

  # Правило 6: Проверка на недостаточную валидацию ввода
  - id: py-insufficient-input-validation
    languages: [python]
    message: "Возможно недостаточная валидация пользовательского ввода"
    severity: INFO
    pattern: |
      @app.$METHOD("...")
      def $FUNC($PARAM: str = ...):
        ...
        $USE($PARAM)
    metavariable-regex:
      metavariable: $PARAM
      regex: (request|query|param|input|data)
    metadata:
      category: security
      cwe: "CWE-20: Improper Input Validation"
      owasp: "A03:2021 - Injection"

# Конфигурация сканирования
config:
  # Игнорировать тестовые файлы
  exclude:
    - "tests/"
    - "**/test_*.py"
    - "**/*_test.py"
    - ".venv/"
    - "venv/"
    - "env/"

  # Включить только Python файлы
  include:
    - "**/*.py"
