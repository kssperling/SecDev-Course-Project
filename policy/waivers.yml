# policy/waivers.yml
# Политика исключений для уязвимостей зависимостей
# Ссылка на политику: project/69_sbom-vuln-mgmt.md

version: "1.0"
created: "$(date -u '+%Y-%m-%d')"
project: "${{ github.repository }}"

# Общие правила:
# 1. Critical/High уязвимости требуют немедленного внимания
# 2. Medium уязвимости должны быть рассмотрены в течение 30 дней
# 3. Low уязвимости могут быть отложены, но требуют мониторинга
# 4. Каждое исключение должно иметь срок действия и обоснование

waivers:
  # Пример структуры waiver (раскомментируйте и заполните при необходимости)
  # - id: "CVE-2024-XXXXX"
  #   package: "example-package"
  #   version: "1.2.3"
  #   severity: "High"
  #   reason: |
  #     Уязвимость затрагивает неиспользуемую функциональность.
  #     Пакет является транзитивной зависимостью, обновление сломает совместимость.
  #     Риск оценивается как низкий для нашего use-case.
  #   mitigation: "Мониторинг обновлений, планируемое обновление в Q2 2025"
  #   issue: "https://github.com/your-org/your-repo/issues/123"
  #   expires_at: "2025-06-30"
  #   approved_by: "security-team@example.com"
  #   created_at: "2024-01-15"

# Инструкции по добавлению waivers:
# 1. Сгенерируйте SBOM и SCA отчет
# 2. Определите уязвимости, требующие исключения
# 3. Создайте Issue в репозитории для отслеживания
# 4. Добавьте запись в этот файл с полным обоснованием
# 5. Установите реалистичный срок действия (не более 1 года)
# 6. Получите одобрение ответственной стороны

# Мониторинг и пересмотр:
# - Ежеквартальный пересмотр всех активных waivers
# - Автоматическое уведомление за 30 дней до истечения срока
# - Принудительное обновление при истечении срока waiver
