# policy/waivers.yml
version: "1.0"
created: "$(date -u '+%Y-%m-%d')"
project: "SecDev-Course-Project"

# Политика управления уязвимостями зависимостей
# Основано на: project/69_sbom-vuln-mgmt.md

# Правила по умолчанию:
# - Critical: Требует немедленного исправления (максимум 7 дней на waiver)
# - High: Требует исправления в течение 30 дней
# - Medium: Рекомендуется исправление в течение 90 дней
# - Low: Может быть отложено, требует мониторинга

waivers:
  # Пример waiver (раскомментируйте и заполните по необходимости)
  # - id: "CVE-2024-XXXXX"
  #   package: "example-library"
  #   version: "1.2.3"
  #   severity: "High"
  #   reason: |
  #     Уязвимость в неиспользуемом модуле.
  #     Библиотека является транзитивной зависимостью, обновление нарушит совместимость.
  #     Риск эксплуатации в нашем контексте низкий.
  #   mitigation: "Мониторинг обновлений, планируемое обновление в следующем релизе"
  #   issue: "https://github.com/kssperling/SecDev-Course-Project/issues/N"
  #   expires_at: "2025-06-30"
  #   approved_by: "security-team"
  #   created_at: "2024-01-15"

# Процесс добавления waivers:
# 1. Обнаружьте уязвимость через SCA
# 2. Оцените риск для проекта
# 3. Создайте Issue для отслеживания
# 4. Добавьте waiver с обоснованием
# 5. Установите реалистичный срок действия
# 6. Получите одобрение ответственной стороны

# Периодический пересмотр:
# - Ежемесячная проверка активных waivers
# - Автоматическое уведомление за 14 дней до истечения
# - Принудительное обновление при истечении waiver
