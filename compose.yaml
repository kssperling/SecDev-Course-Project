# docker-compose.yml
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # Безопасность: read-only файловая система
    read_only: true
    # tmpfs для временных файлов
    tmpfs:
      - /tmp
      - /var/tmp

  # Сервис для тестирования (опционально)
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pytest", "tests/", "-v"]
    environment:
      - APP_ENV=test
      - PYTHONPATH=/app
    depends_on:
      - app
