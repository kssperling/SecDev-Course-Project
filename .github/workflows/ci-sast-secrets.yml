name: Security - SAST & Secrets

on:
  workflow_dispatch:          # Ручной запуск
  push:
    branches: [ main, p10-sast-secrets ]
    paths:
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.yaml'
      - '**/*.yml'
      - 'security/**'
      - '.github/workflows/ci-sast-secrets.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.yaml'
      - '**/*.yml'
      - 'security/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast_secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Полная история для Gitleaks

    - name: Setup environment
      run: |
        mkdir -p EVIDENCE/P10
        echo "Setup completed at $(date)" > EVIDENCE/P10/run_info.txt

    - name: Run Semgrep SAST scan
      run: |
        echo "Starting Semgrep SAST scan..."

        # Используем Docker для Semgrep
        docker run --rm \
          -v $PWD:/src \
          -w /src \
          returntocorp/semgrep:latest \
          semgrep scan \
          --config auto \
          --config p/ci \
          --config /src/security/semgrep/rules.yml \
          --sarif \
          --output /src/EVIDENCE/P10/semgrep.sarif \
          --metrics=off \
          --no-rewrite-rule-ids \
          --disable-version-check || true

        echo "Semgrep scan completed"

    - name: Run Gitleaks secrets scan
      run: |
        echo "Starting Gitleaks secrets scan..."

        # Используем Docker для Gitleaks
        docker run --rm \
          -v $PWD:/repo \
          -w /repo \
          zricethezav/gitleaks:latest \
          detect \
          --no-banner \
          --config=/repo/security/.gitleaks.toml \
          --source=/repo \
          --report-format=json \
          --report-path=/repo/EVIDENCE/P10/gitleaks.json \
          --verbose || true

        echo "Gitleaks scan completed"

    - name: Generate summary report
      run: |
        echo "# SAST & Secrets Scan Summary" > EVIDENCE/P10/sast_summary.md
        echo "" >> EVIDENCE/P10/sast_summary.md
        echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> EVIDENCE/P10/sast_summary.md
        echo "**Commit:** ${{ github.sha }}" >> EVIDENCE/P10/sast_summary.md
        echo "**Repository:** ${{ github.repository }}" >> EVIDENCE/P10/sast_summary.md
        echo "**Workflow:** ${{ github.workflow }}" >> EVIDENCE/P10/sast_summary.md
        echo "" >> EVIDENCE/P10/sast_summary.md

        # Semgrep summary
        if [ -s EVIDENCE/P10/semgrep.sarif ]; then
          echo "## Semgrep SAST Results" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          # Подсчет findings по уровням
          echo "Scan completed. SARIF report generated." >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "View full report: [semgrep.sarif](semgrep.sarif)" >> EVIDENCE/P10/sast_summary.md
        else
          echo "## Semgrep SAST Results" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "No Semgrep report generated or report is empty." >> EVIDENCE/P10/sast_summary.md
        fi

        echo "" >> EVIDENCE/P10/sast_summary.md

        # Gitleaks summary
        if [ -s EVIDENCE/P10/gitleaks.json ]; then
          echo "## Gitleaks Secrets Results" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          # Подсчет найденных секретов
          if command -v jq >/dev/null 2>&1; then
            SECRET_COUNT=$(jq '. | length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo "0")
            echo "Found $SECRET_COUNT potential secrets." >> EVIDENCE/P10/sast_summary.md
          else
            echo "Found potential secrets. Details in JSON report." >> EVIDENCE/P10/sast_summary.md
          fi

          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "View full report: [gitleaks.json](gitleaks.json)" >> EVIDENCE/P10/sast_summary.md
        else
          echo "## Gitleaks Secrets Results" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "No secrets found or report is empty." >> EVIDENCE/P10/sast_summary.md
        fi

        echo "" >> EVIDENCE/P10/sast_summary.md
        echo "## Next Steps" >> EVIDENCE/P10/sast_summary.md
        echo "" >> EVIDENCE/P10/sast_summary.md
        echo "1. Review SAST findings in semgrep.sarif" >> EVIDENCE/P10/sast_summary.md
        echo "2. Review potential secrets in gitleaks.json" >> EVIDENCE/P10/sast_summary.md
        echo "3. Fix critical issues or add exceptions to configuration files" >> EVIDENCE/P10/sast_summary.md
        echo "4. Re-run scan after fixes" >> EVIDENCE/P10/sast_summary.md

    - name: Upload SAST & Secrets artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: p10-sast-secrets-evidence
        path: EVIDENCE/P10/
        retention-days: 30
