# .github/workflows/container-ci.yml
name: Container Checks

on:
  push:
    branches: [ p07-container-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t myapp .
        echo "✅ Image built successfully"

    - name: Test basic container functionality
      run: |
        # Тест 1: Контейнер может запуститься
        echo "=== Test 1: Container startup ==="
        docker run --rm myapp python -c "print('Hello from container!')"

        # Тест 2: Non-root пользователь
        echo "=== Test 2: Non-root user ==="
        user_id=$(docker run --rm myapp id -u)
        echo "User ID: $user_id"
        if [ "$user_id" = "0" ]; then
          echo "❌ FAIL: Running as root"
          exit 1
        else
          echo "✅ PASS: Running as non-root user"
        fi

        # Тест 3: Контейнер живет хотя бы 10 секунд
        echo "=== Test 3: Container longevity ==="
        docker run -d --name long-test myapp python -c "import time; time.sleep(30)"
        sleep 5
        if docker ps | grep -q long-test; then
          echo "✅ PASS: Container is still running"
          docker stop long-test
        else
          echo "❌ FAIL: Container stopped prematurely"
          docker logs long-test || true
          exit 1
        fi

        echo "✅ All basic tests passed!"
