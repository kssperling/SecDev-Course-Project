# .github/workflows/container-ci.yml
name: Container CI

on:
  push:
    branches: [ p07-container-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  container-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t fastapi-app .
        echo "✅ Image built successfully"

    - name: Lint Dockerfile
      run: |
        docker run --rm -i hadolint/hadolint < Dockerfile

    - name: Verify non-root user (C2 критерий)
      run: |
        user_id=$(docker run --rm fastapi-app id -u)
        echo "User ID: $user_id"
        if [ "$user_id" = "0" ]; then
          echo "❌ FAIL: Running as root"
          exit 1
        else
          echo "✅ PASS: Running as non-root user (ID: $user_id)"
        fi

    - name: Test container startup (C3 критерий)
      run: |
        # Запускаем контейнер
        docker run -d --name app-test -p 8000:8000 fastapi-app
        echo "Container started, waiting for healthcheck..."

        # Ждем и проверяем healthcheck
        sleep 15
        health_status=$(docker inspect --format='{{.State.Health.Status}}' app-test)
        echo "Health status: $health_status"

        if [ "$health_status" = "healthy" ] || [ "$health_status" = "starting" ]; then
          echo "✅ PASS: Healthcheck working"
        else
          echo "❌ FAIL: Healthcheck not working - status: $health_status"
          echo "=== Container logs ==="
          docker logs app-test
          exit 1
        fi

        # Останавливаем контейнер
        docker stop app-test
        docker rm app-test

    - name: Scan for vulnerabilities (C4 критерий)
      run: |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest \
          image --severity HIGH,CRITICAL fastapi-app

    - name: Test multi-stage build (C1 критерий)
      run: |
        echo "=== Image size ==="
        docker images fastapi-app --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

        echo "=== Image history ==="
        docker history fastapi-app
