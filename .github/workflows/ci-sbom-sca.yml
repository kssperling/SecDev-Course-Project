name: Security - SBOM & SCA

on:
  workflow_dispatch:
  push:
    branches: [ main, p09-sbom-sca ]
    paths:
      - '**/*.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'poetry.lock'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'requirements*.txt'

permissions:
  contents: read
  issues: write  # Для создания Issues
  pull-requests: write  # Для комментариев в PR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom_sca:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies for analysis
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl

    - name: Create evidence directory
      run: mkdir -p EVIDENCE/P09

    - name: Generate SBOM with Syft
      run: |
        docker run --rm \
          -v $PWD:/work \
          -w /work \
          anchore/syft:latest \
          packages dir:. \
          -o cyclonedx-json \
          > EVIDENCE/P09/sbom.json

    - name: Run SCA scan with Grype
      run: |
        set -e
        docker run --rm \
          -v $PWD:/work \
          -w /work \
          anchore/grype:latest \
          sbom:/work/EVIDENCE/P09/sbom.json \
          -o json \
          > EVIDENCE/P09/sca_report.json

    - name: Generate human-readable summary
      run: |
        echo "# SCA Vulnerability Report" > EVIDENCE/P09/sca_summary.md
        echo "" >> EVIDENCE/P09/sca_summary.md
        echo "**Report Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> EVIDENCE/P09/sca_summary.md
        echo "**Commit:** ${{ github.sha }}" >> EVIDENCE/P09/sca_summary.md
        echo "**Repository:** ${{ github.repository }}" >> EVIDENCE/P09/sca_summary.md
        echo "" >> EVIDENCE/P09/sca_summary.md

        if [ -s EVIDENCE/P09/sca_report.json ]; then
          echo "## Vulnerability Summary" >> EVIDENCE/P09/sca_summary.md
          echo "" >> EVIDENCE/P09/sca_summary.md

          # Подсчет уязвимостей по уровням
          jq -r '
            .matches
            | group_by(.vulnerability.severity)
            | map({severity: .[0].vulnerability.severity, count: length})
            | sort_by(.severity)
            | reverse
            | .[]
            | "| **\(.severity)** | \(.count) |"
          ' EVIDENCE/P09/sca_report.json >> EVIDENCE/P09/sca_summary.md 2>/dev/null || echo "No vulnerabilities detected" >> EVIDENCE/P09/sca_summary.md

          echo "" >> EVIDENCE/P09/sca_summary.md
          echo "## Top 5 Critical/High Vulnerabilities" >> EVIDENCE/P09/sca_summary.md
          echo "" >> EVIDENCE/P09/sca_summary.md

          # Топ 5 самых опасных уязвимостей
          jq -r '
            .matches
            | sort_by(.vulnerability.severity)
            | reverse
            | .[0:5]
            | .[]
            | "- **\(.vulnerability.id)** (\(.vulnerability.severity)) - \(.artifact.name)@\(.artifact.version)"
          ' EVIDENCE/P09/sca_report.json >> EVIDENCE/P09/sca_summary.md 2>/dev/null || echo "No high severity vulnerabilities" >> EVIDENCE/P09/sca_summary.md
        fi

    # ★★2 УЛУЧШЕНИЯ - НАЧАЛО
    - name: Create GitHub Issue for Critical vulnerabilities
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Checking for Critical vulnerabilities..."

        if [ -s EVIDENCE/P09/sca_report.json ]; then
          CRITICAL_COUNT=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' EVIDENCE/P09/sca_report.json)

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "Found $CRITICAL_COUNT Critical vulnerabilities"
            echo "Note: GitHub Issue creation requires additional permissions"
            echo "To enable: add 'issues: write' to permissions and configure token"
          fi
        fi

    - name: Generate SBOM attestation
      run: |
        echo "Generating SBOM attestation..."

        cat > EVIDENCE/P09/attestation.json << EOF
        {
          "attestation": {
            "type": "https://in-toto.io/Statement/v0.1",
            "subject": [
              {
                "name": "sbom.json",
                "digest": {
                  "sha256": "$(sha256sum EVIDENCE/P09/sbom.json | cut -d' ' -f1)"
                }
              }
            ],
            "predicateType": "https://spdx.org/Document",
            "predicate": {
              "creator": "GitHub Actions SBOM/SCA Workflow",
              "created": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
              "supplier": "${{ github.repository_owner }}",
              "origin": {
                "repository": "${{ github.repository }}",
                "commit": "${{ github.sha }}",
                "workflow": "${{ github.workflow }}",
                "run_id": "${{ github.run_id }}"
              }
            }
          }
        }
        EOF

        echo "SBOM attestation generated"

    - name: Fail workflow on Critical vulnerabilities in PR
      if: github.event_name == 'pull_request'
      run: |
        echo "Checking for Critical vulnerabilities in PR..."

        if [ -s EVIDENCE/P09/sca_report.json ]; then
          CRITICAL_COUNT=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' EVIDENCE/P09/sca_report.json)
          HIGH_COUNT=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' EVIDENCE/P09/sca_report.json)

          echo "Found $CRITICAL_COUNT Critical and $HIGH_COUNT High vulnerabilities"

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "##[error] ❌ Critical vulnerabilities found! PR cannot be merged."
            echo "##[error] Please fix Critical vulnerabilities before merging."
            exit 1
          elif [ "$HIGH_COUNT" -gt 0 ]; then
            echo "##[warning] ⚠️ $HIGH_COUNT High vulnerabilities found. Review recommended."
          else
            echo "✅ No Critical or High vulnerabilities found"
          fi
        fi
    # ★★2 УЛУЧШЕНИЯ - КОНЕЦ

    - name: Upload evidence artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: p09-sbom-sca-evidence
        path: EVIDENCE/P09/
        retention-days: 30
